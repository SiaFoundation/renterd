name: Update UI and open PR

on:
  repository_dispatch:
    types: [update-ui]
  # Enable manual trigger
  workflow_dispatch:

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Update UI and open PR
        uses: SiaFoundation/workflows/.github/actions/ui-update@2dc0b0ff59df8c1a5345719e34e62a398f7a165c # master
        with:
          moduleName: "renterd"
          goVersion: "1.21"
          token: ${{ secrets.GITHUB_TOKEN }}
