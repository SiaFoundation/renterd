name: Update UI and open PR

on:
  repository_dispatch:
    types: [update-ui]
  # Enable manual trigger
  workflow_dispatch:

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Update UI and open PR
        uses: SiaFoundation/workflows/.github/actions/ui-update@4495be4e01530009c7706c7c6fa9ac1031e12789 # master
        with:
          moduleName: "renterd"
          goVersion: "1.21"
          token: ${{ secrets.GITHUB_TOKEN }}
