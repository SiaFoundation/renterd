name: Update UI and open PR

on:
  repository_dispatch:
    types: [update-ui]
  # Enable manual trigger
  workflow_dispatch:

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Update UI and open PR
        uses: SiaFoundation/workflows/.github/actions/ui-update@b42741de5798fcb1881143d714a923501ec4ff89 # master
        with:
          moduleName: "renterd"
          goVersion: "1.21"
          token: ${{ secrets.GITHUB_TOKEN }}
