name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate OpenAPI spec
        run: |
          npm install --global swagger-spec-validator
          swagger-spec-validator openapi.yml
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=30m
  test-sqlite: # Run all tests against SQLite
    needs: analyze
    uses: SiaFoundation/workflows/.github/workflows/go-test.yml@2dc0b0ff59df8c1a5345719e34e62a398f7a165c # master
    secrets: inherit

  test-mysql: # Run all tests against MySQL
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Configure MySQL
        uses: shogo82148/actions-setup-mysql@083ec148d28e62f2b24b8f4541693dfe1d50488d # v1.54.0
        with:
          distribution: "mysql"
          mysql-version: "9"
          root-password: test
      - name: Test
        uses: SiaFoundation/workflows/.github/actions/go-test@2dc0b0ff59df8c1a5345719e34e62a398f7a165c # master
        env:
          RENTERD_DB_URI: 127.0.0.1:3306
          RENTERD_DB_USER: root
          RENTERD_DB_PASSWORD: test
        with:
          go-test-args: "-race;-timeout=20m;-tags=netgo"

  success: # Use in branch rulesets to ensure all matrix jobs completed successfully
    needs: [test-sqlite, test-mysql]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Success!"
