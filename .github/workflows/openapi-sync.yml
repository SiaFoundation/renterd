name: Sync OpenAPI Versions

permissions:
  contents: write
  pull-requests: write

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  sync:
    uses: SiaFoundation/workflows/.github/workflows/sync-openapi-version.yml@ead28a59027a53b5ab675d1853fecc01564c6e9b # v0.1.0
    with:
      spec_path: openapi.yml
